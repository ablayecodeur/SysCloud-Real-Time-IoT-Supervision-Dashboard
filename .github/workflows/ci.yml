name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mqtt-consumer, api, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            services/${{ matrix.service }}/package.json
            frontend/package.json

      - name: Install deps — ${{ matrix.service }}
        working-directory: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
        run: npm ci --ignore-scripts

      - name: Lint — ${{ matrix.service }}
        working-directory: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
        run: npm run lint --if-present

      - name: Type-check — frontend
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: npx tsc --noEmit

  # ─── Build Docker images ─────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service:
          - { context: services/mqtt-broker,   image: mqtt-broker }
          - { context: services/mqtt-consumer, image: mqtt-consumer }
          - { context: services/api,           image: api }
          - { context: services/simulator,     image: simulator }
          - { context: frontend,               image: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: syscloud/${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Compose smoke test ──────────────────────────────────────────────────────
  smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          sed -i 's/change_me_mqtt_password/ci_mqtt_pass/g'       .env
          sed -i 's/change_me_influx_password/ci_influx_pass/g'   .env
          sed -i 's/change_me_influx_super_secret_token/ci_token/g' .env
          sed -i 's/change_me_grafana_password/ci_grafana_pass/g' .env
          sed -i 's/change_me_jwt_super_secret_key_32chars_min/ci_jwt_secret_at_least_32_chars_long/g' .env

      - name: Start core services
        run: |
          docker compose up --build -d mosquitto influxdb
          docker compose wait influxdb || true
          sleep 20

      - name: Health check — InfluxDB
        run: docker exec syscloud-influxdb influx ping

      - name: Start remaining services
        run: docker compose up --build -d mqtt-consumer api

      - name: Wait for API
        run: |
          for i in {1..12}; do
            curl -sf http://localhost:4000/health && break
            echo "Waiting… ($i/12)"
            sleep 5
          done

      - name: API health assertion
        run: |
          STATUS=$(curl -sf http://localhost:4000/health | jq -r '.status')
          [ "$STATUS" = "ok" ] || (echo "Health check failed: $STATUS" && exit 1)

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=50
