name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/syscloud-mqtt-broker
            ghcr.io/${{ github.repository_owner }}/syscloud-mqtt-consumer
            ghcr.io/${{ github.repository_owner }}/syscloud-api
            ghcr.io/${{ github.repository_owner }}/syscloud-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push — mqtt-broker
        uses: docker/build-push-action@v5
        with:
          context: services/mqtt-broker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/syscloud-mqtt-broker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — mqtt-consumer
        uses: docker/build-push-action@v5
        with:
          context: services/mqtt-consumer
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/syscloud-mqtt-consumer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — api
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/syscloud-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/syscloud-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/syscloud
            git pull origin main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deployed $IMAGE_TAG"
