name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below.

  - type: dropdown
    id: service
    attributes:
      label: Affected service
      options:
        - MQTT Broker (Mosquitto)
        - MQTT Consumer
        - API (Fastify)
        - Frontend (Next.js)
        - Grafana / InfluxDB
        - Docker Compose / Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make dev-sim`
        2. Navigate to ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run `make logs` and paste the relevant output.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
